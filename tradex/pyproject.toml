[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex"
version = "3.1.4"
description = "China Financial Data MCP Server based on AKShare - Free alternative to commercial financial data MCPs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "tradex Contributors" },
]
keywords = ["mcp", "akshare", "a-share", "stock", "finance", "china", "financial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "mcp>=1.0.0",
    "akshare>=1.18.81",
    "eltdx>=1.2.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "stockstats>=0.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
http = [
    "uvicorn>=0.29.0",
    "starlette>=0.37.0",
    "sse-starlette>=1.6.0",
]
ws = [
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "network: marks tests that require network access (deselect with '-m \"not network\"')",
]
